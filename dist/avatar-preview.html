<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ea">
  <title>我的小主角｜小小畫畫花園</title>
  <link rel="stylesheet" href="avatar-preview.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><span aria-hidden="true">🌱</span>小小畫畫花園</a>
    <button id="choose-again" class="quiet-button" type="button">換主角</button>
  </header>

  <main>
    <div class="page-title">
      <h1>我的小主角</h1>
      <p>替主角換裝，看看主角在畫框外和圖案裡怎麼玩。</p>
    </div>

    <div class="workbench">
      <section class="stage-section card" aria-labelledby="stage-title">
        <div class="stage-header">
          <h2 id="stage-title">畫框冒險</h2>
          <div class="segmented" aria-label="預覽階段" role="group">
            <button id="outside" type="button" aria-pressed="true">畫畫中</button>
            <button id="inside" type="button" aria-pressed="false">完成後</button>
          </div>
        </div>
        <div class="stage-display">
          <canvas id="stage" width="960" height="620" role="img" aria-label="主角沿著畫框散步和攀爬"></canvas>
          <button id="pause-motion" class="pause" type="button" aria-label="暫停動畫" title="暫停動畫"><span aria-hidden="true">Ⅱ</span></button>
        </div>
        <div class="stage-options">
          <div id="scene-picker" class="scene-picker" role="group" aria-label="試玩圖案"></div>
          <p id="stage-caption" class="caption" role="status"></p>
        </div>
        <div id="treasure" class="treasure">
          <canvas id="chest-art" width="64" height="58" aria-hidden="true"></canvas>
          <div class="treasure-copy">
            <h3>作品寶箱</h3>
            <p id="treasure-caption">切到「完成後」就能開寶箱。</p>
          </div>
          <button id="open-chest" class="action-button" type="button" disabled>開寶箱</button>
          <div id="treasure-result" class="treasure-result" hidden>
            <span id="reward-preview" class="reward-preview" aria-hidden="true"></span>
            <div><p id="reward-type" class="reward-type"></p><p id="reward-name" class="reward-name"></p></div>
            <button id="use-reward" type="button" class="quiet-button"></button>
          </div>
        </div>
      </section>

      <section class="character-section card" aria-labelledby="character-title">
        <div class="panel-header"><h2 id="character-title">主角畫布</h2><span id="character-name" class="character-name"></span></div>
        <div class="portrait-paper">
          <canvas id="portrait" width="480" height="608" aria-label="主角畫布，選色後可以在主角上畫畫"></canvas>
        </div>
        <div class="paint-bar" role="group" aria-label="主角畫筆">
          <div id="paint-colors" class="paint-colors"></div>
          <button id="undo-portrait" type="button" class="icon-button" title="復原筆跡" aria-label="復原筆跡" disabled>↶</button>
        </div>
        <div class="wardrobe-header">
          <h2>我的衣櫃</h2>
          <button id="take-off" class="quiet-button" type="button" disabled>取下</button>
        </div>
        <div id="item-categories" class="item-categories" aria-label="穿搭分類" role="group"></div>
        <div id="wearables" class="wearables" aria-label="試穿款式" role="group"></div>
      </section>
    </div>
    <p id="announcement" class="visually-hidden" role="status"></p>
  </main>

  <dialog id="choose-character" aria-labelledby="choose-title">
    <div class="chooser-heading">
      <h2 id="choose-title">選一個小主角</h2>
      <button id="close-chooser" type="button" class="icon-button" aria-label="關閉" hidden>×</button>
    </div>
    <div class="character-picker">
      <button type="button" data-person="boy"><canvas width="240" height="304" aria-hidden="true"></canvas><span>小男孩</span></button>
      <button type="button" data-person="girl"><canvas width="240" height="304" aria-hidden="true"></canvas><span>小女孩</span></button>
    </div>
  </dialog>
  <script type="module" src="avatar-preview.js"></script>
</body>
</html>
