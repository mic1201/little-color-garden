<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ed"><meta name="description" content="大大的畫布，小小的想像。適合平板的簡單畫畫與塗色小天地。"><title>小小畫畫花園</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div class="brand"><span class="brand-icon">✿</span><div><h1>小小畫畫花園</h1><p>今天，想畫什麼呢？</p></div></div><div class="top-actions"><button id="focus-enter" class="focus-button" aria-label="全螢幕畫畫">⛶<span>全螢幕</span></button><button id="undo" class="icon-btn" aria-label="復原上一筆">↶<small>上一步</small></button><button id="redo" class="icon-btn" aria-label="重做下一筆">↷<small>下一步</small></button><button id="parent" class="parent-button">⚙<span>大人幫手</span></button></div></header><div class="focus-controls" hidden><span id="focus-label">大畫布模式</span><button id="focus-tools" aria-expanded="false">🎨 顯示工具</button><button id="focus-undo" aria-label="復原上一筆">↶</button><button id="focus-exit">↙ 返回</button></div><main><aside class="toolbox"><section><h2>選個顏色</h2><div id="colors" class="colors" role="group" aria-label="畫筆顏色"></div></section><section class="brush-section"><details id="brush-picker"><summary id="brush-summary"><span id="brush-icon" aria-hidden="true">🖍️</span> <span id="brush-name">彩色筆</span> ▾</summary><div id="tools" class="tools" role="group" aria-label="畫筆種類"></div></details><div id="stamp-options" class="stamp-options" role="group" aria-label="印章圖案" hidden></div></section><section class="sizes-section"><h2>大或小？</h2><div id="sizes" class="sizes" role="group" aria-label="畫筆粗細"></div></section></aside><div class="art-space"><div class="paper-top"><span id="picture-title">✨ 自由畫</span><span class="paper-hint">用手指或觸控筆畫畫</span></div><div class="paper-frame"><div id="board" class="board"><canvas id="ink" width="1000" height="900" aria-label="畫畫區，用手指或觸控筆拖曳繪畫"></canvas><div id="outline" aria-hidden="true"></div><div id="welcome" class="welcome"><span>✧</span><p>點點、畫畫<br>把想像變成顏色！</p><small>點「選圖案」就能開始塗色</small></div></div></div><div class="paper-bottom"><span id="save-status" role="status">作品留在這台裝置</span><span>慢慢畫，沒有畫錯 ♡</span></div></div></main><footer><details id="pattern-picker"><summary>🦋 選圖案 <span>點一下展開</span></summary><div id="patterns" class="patterns" role="group" aria-label="描邊圖案"></div></details></footer></div><dialog id="parent-dialog"><div class="dialog-title"><h2>大人幫手</h2><button class="close" data-close aria-label="關閉">×</button></div><p>作品只暫存在這個瀏覽器，不會上傳。清除瀏覽器資料、無痕模式或換裝置可能找不到，喜歡的畫請另存圖片。</p><button id="export" class="action primary">↓ 儲存作品 PNG</button><button id="clear" class="action danger">♻ 換一張乾淨的紙</button><p class="tiny">平板小提示：若圖片另開視窗，長按圖片儲存，或使用系統分享。直向、橫向都可以畫。</p><div id="export-preview"></div></dialog><dialog id="confirm-dialog"><div class="dialog-title"><h2 id="confirm-title">換一張紙嗎？</h2></div><p id="confirm-message">目前這張畫會被清掉，先請大人儲存喜歡的作品。</p><div class="confirm-actions"><button id="cancel" class="action">繼續畫這張</button><button id="confirm" class="action primary">確定換一張</button></div></dialog><script type="module" src="app.js"></script></body></html>
